spring.application.name=cedro-backend

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Uploads
cedro.upload.dir=${CEDRO_UPLOAD_DIR:${java.io.tmpdir}/cedro/uploads}

# Server
server.port=${PORT:8080}

# Logging — WARN em producao, nao DEBUG
logging.level.com.cedro=WARN
logging.level.com.cedro.service.EmailService=INFO
logging.level.org.springframework.security=WARN

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.refresh.token=${GOOGLE_REFRESH_TOKEN}
google.meet.release.minutes.before=${GOOGLE_MEET_RELEASE_MINUTES_BEFORE:15}

# RevenueCat
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.enabled=${MAIL_ENABLED:false}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# WebRTC TURN/STUN
turn.urls=${TURN_URLS:}
turn.shared.secret=${TURN_SHARED_SECRET:}
turn.username=${TURN_USERNAME:}
turn.credential=${TURN_CREDENTIAL:}
turn.metered.domain=${TURN_METERED_DOMAIN:}
turn.metered.secret-key=${TURN_METERED_SECRET_KEY:}
