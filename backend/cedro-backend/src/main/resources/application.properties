spring.application.name=cedro-backend

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Uploads
cedro.upload.dir=${CEDRO_UPLOAD_DIR:${java.io.tmpdir}/cedro/uploads}

# Server
server.port=${PORT:8080}

# Logging — WARN em producao, nao DEBUG
logging.level.com.cedro=WARN
logging.level.org.springframework.security=WARN

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# Agora.io
agora.app.id=${AGORA_APP_ID:}
agora.app.certificate=${AGORA_APP_CERTIFICATE:}
agora.token.expiration.seconds=${AGORA_TOKEN_EXPIRATION_SECONDS:3600}

# RevenueCat
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:}

# WebRTC TURN/STUN
turn.urls=${TURN_URLS:}
turn.shared.secret=${TURN_SHARED_SECRET:}
turn.username=${TURN_USERNAME:}
turn.credential=${TURN_CREDENTIAL:}
turn.metered.domain=${TURN_METERED_DOMAIN:}
turn.metered.secret-key=${TURN_METERED_SECRET_KEY:}
